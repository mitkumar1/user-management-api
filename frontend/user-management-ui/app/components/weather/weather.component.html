<div>
  <input [(ngModel)]="city" placeholder="Enter city name" />
  <button (click)="getWeather()">Get Weather</button>
</div>
<div *ngIf="weather">
  <h2>{{ weather.name }}</h2>
  <p>Temperature: {{ weather.main.temp }} °C</p>
  <p>Weather: {{ weather.weather[0].description }}</p>
</div>
<div *ngIf="error">{{ error }}</div>
