# Server Configuration
server.port=8080
# server.servlet.context-path=/api/v1

# Application Configuration
spring.application.name=user-management-api

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (uncomment for production)
# spring.datasource.url=jdbc:mysql://localhost:3306/user_management_db
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Security Configuration - Interview Question: Passwordless Access
# To make specific endpoints accessible without authentication (public access)
# Disable Spring Security for specific URLs or completely
spring.security.user.name=admin
spring.security.user.password=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Public Endpoints Configuration (No Authentication Required)
# These endpoints will be accessible without any security
app.public.endpoints=/api/auth/login,/api/auth/register,/api/public/**,/h2-console/**,/api/submit/**

# CORS Configuration for Frontend Access
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# For MySQL (uncomment for production)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Security Configuration
app.jwtSecret=mySecretKeyForJWTWhichMustBeAtLeast512BitsLongForHS512AlgorithmToWorkProperly1234567890
app.jwtExpirationInMs=86400000

# Logging Configuration
logging.level.com.kumar.wipro.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
