
# Customized resource names and ACR registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umapi-deployment-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: umapi-app-prod
  template:
    metadata:
      labels:
        app: umapi-app-prod
    spec:
      containers:
      - name: user-management-api
        image: umapiprodacr.azurecr.io/user-management-api:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: umapi-service-prod
spec:
  type: LoadBalancer
  selector:
    app: umapi-app-prod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
